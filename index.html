<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec">
<title>Менеджер задач</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
:root{
  --bg:#f3f1ec;--card:#ffffff;--ink:#17212b;--muted:#6b7a88;--line:#e4e1d8;
  --blue:#1674c7;--blue-soft:#e8f2fc;--danger:#c43d4b;--ok:#1a7f4b;--warn:#b7791f;--soft:#ebe8e0;
}
html[data-theme="dark"]{
  --bg:#121614;--card:#1a201d;--ink:#f0f3f1;--muted:#93a199;--line:#2a332e;
  --blue:#3b8ee6;--blue-soft:#1b2f42;--danger:#ff8b98;--ok:#5fd39b;--warn:#f6ad55;--soft:#232b27;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Экран входа */
.login{max-width:420px;margin:10vh auto;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.04)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:19px}
.login h1{font-size:23px;margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
.auth-stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{min-height:44px;border:1px solid transparent;border-radius:11px;padding:9px 15px;background:var(--soft);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,background .15s}
.btn:hover:not(:disabled){opacity:.9}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--blue);color:#fff}
.btn.yandex{background:#fc3f1d;color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px;border-radius:8px}
.error{color:var(--danger);font-size:14px;min-height:20px;margin-top:10px}

/* Основное приложение */
#app{display:flex;flex-direction:column;height:100dvh;max-width:980px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--soft)}
.top-info{flex:1;min-width:140px}
.top-info strong{display:block;font-size:16px;line-height:1.2}
.top-info small{color:var(--muted);font-size:12px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn.on{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}

/* Закреплённая цель */
.pinbar{display:none;align-items:center;gap:10px;padding:10px 16px;background:var(--blue-soft);border-bottom:1px solid var(--line);font-size:14px}
.pinbar.visible{display:flex}
.pinbar span{flex:1;overflow-wrap:anywhere}

/* Панель фильтров и статистики */
.controls{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tab{min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13px;font-weight:600}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.search{min-height:36px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;min-width:200px}

/* Лента задач */
.feed{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:15px}

/* Карточка задачи */
.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;align-items:flex-start;gap:12px;transition:transform .2s,opacity .3s}
.task.done{opacity:.68}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.task.task-removing{opacity:0;transform:scale(.95)}
.chk{width:22px;height:22px;margin-top:2px;accent-color:var(--blue);cursor:pointer;flex:none}
.task-main{flex:1;min-width:0}
.task-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.task-title{font-size:15px;font-weight:500;overflow-wrap:anywhere;word-break:break-word}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.02em}
.prio-high{background:rgba(196,61,75,.15);color:var(--danger)}
.prio-medium{background:rgba(183,121,31,.16);color:var(--warn)}
.prio-low{background:rgba(26,127,75,.15);color:var(--ok)}
.status-select{font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.task-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.deadline.overdue{color:var(--danger);font-weight:600}

/* Вложение в задаче */
.file{margin-top:8px;display:inline-flex;align-items:center;gap:9px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);text-align:left}
.file strong{display:block;font-size:13px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--muted);font-size:11px}

/* Форма создания задачи */
.composer{background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.filechip{display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:8px;background:var(--soft);border-radius:9px;font-size:13px}
.filechip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row input[type="text"]{flex:1;min-width:200px;min-height:44px;padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form-row select,.form-row input[type="date"]{min-height:44px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.chat-err{color:var(--danger);font-size:13px;margin-top:6px;min-height:18px}

/* Контекстное меню и модалка настроек */
.menu{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;min-width:190px}
.menu button{background:transparent;border:0;color:var(--ink);padding:9px 12px;text-align:left;border-radius:8px;font-size:14px}
.menu button:hover{background:var(--soft)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:380px}
.modal-card h2{margin:0 0 14px;font-size:18px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setting-row select{min-height:38px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}

@media(max-width:600px){
  .topbar{padding:10px 12px}
  .controls{padding:10px 12px}
  .search{width:100%}
  .form-row select,.form-row input[type="date"]{flex:1}
}
</style>
</head>
<body>

<section id="login" class="login">
  <div class="brand">
    <span class="logo" aria-hidden="true">✓</span>
    <div>
      <h1>Менеджер задач</h1>
      <div class="muted">Закрытое рабочее пространство</div>
    </div>
  </div>
  <p class="muted">Доступ открыт только участникам из разрешённого списка.</p>
  <div class="auth-stack">
    <button id="loginBtn" class="btn primary" type="button">Продолжить с Google</button>
    <button id="gisBtn" class="btn primary" type="button">Войти через Google</button>
    <button id="yandexBtn" class="btn yandex" type="button">Войти через Яндекс ID</button>
  </div>
  <div id="loginError" class="error" role="status" aria-live="polite"></div>
</section>

<main id="app" class="hidden">
  <header class="topbar">
    <img id="photo" class="avatar hidden" alt="">
    <div class="top-info">
      <strong>Менеджер задач <span id="counter" class="muted" style="font-weight:400"></span></strong>
      <small id="status">Подключение…</small>
    </div>
    <div class="top-actions">
      <button id="pushBtn" class="btn sm ghost hidden" type="button"><span class="lbl">Уведомления</span></button>
      <a id="adminLink" class="btn sm ghost hidden" href="./admin/" style="text-decoration:none">Админка</a>
      <button id="settingsBtn" class="btn sm ghost" type="button" title="Настройки">⚙️</button>
      <button id="logout" class="btn sm ghost" type="button">Выйти</button>
    </div>
  </header>

  <div id="pinbar" class="pinbar">
    <span>📌 <strong>Главная цель:</strong> <span id="pintext"></span></span>
    <button id="unpin" class="btn sm ghost hidden" type="button">Открепить</button>
  </div>

  <div class="controls">
    <div class="tabs" id="filterTabs">
      <button class="tab active" data-filter="all" type="button">Все</button>
      <button class="tab" data-filter="active" type="button">Активные</button>
      <button class="tab" data-filter="doing" type="button">В работе</button>
      <button class="tab" data-filter="done" type="button">Выполненные</button>
      <button class="tab" data-filter="mine" type="button">Мои</button>
    </div>
    <input id="searchInput" class="search" type="search" placeholder="Поиск по задачам…">
  </div>

  <section id="feed" class="feed" aria-label="Список задач">
    <div id="empty" class="empty">Задач пока нет. Добавьте первую задачу ниже.</div>
    <div id="tasks" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <form id="form" class="composer">
    <div id="filechip" class="filechip hidden">
      <span>📎 <strong id="fcName"></strong> (<small id="fcSize"></small>)</span>
      <button id="fcRemove" class="btn sm ghost" type="button">Убрать</button>
    </div>
    <div class="form-row">
      <input id="file" type="file" class="hidden">
      <button id="attachBtn" class="btn ghost" type="button" title="Прикрепить файл (до 20 МБ)">📎</button>
      <input id="text" type="text" maxlength="2000" placeholder="Новая задача…" autocomplete="off">
      <select id="priority" aria-label="Приоритет">
        <option value="low">Низкий</option>
        <option value="medium" selected>Средний</option>
        <option value="high">Высокий</option>
      </select>
      <input id="deadline" type="date" aria-label="Дедлайн" title="Срок выполнения">
      <button id="send" class="btn primary" type="submit" disabled>Добавить</button>
    </div>
    <div id="chatError" class="chat-err" role="status" aria-live="polite"></div>
  </form>
</main>

<div id="taskMenu" class="menu hidden" role="menu"></div>

<div id="settingsPanel" class="modal hidden">
  <div class="modal-card">
    <h2>Настройки</h2>
    <div class="setting-row">
      <label for="themeMode">Тема оформления</label>
      <select id="themeMode">
        <option value="light">Светлая</option>
        <option value="dark">Тёмная</option>
      </select>
    </div>
    <div class="setting-row" style="border-bottom:0">
      <label for="clockMode">Формат времени</label>
      <select id="clockMode">
        <option value="auto">Авто</option>
        <option value="24">24 часа</option>
        <option value="12">12 часов</option>
      </select>
    </div>
    <div style="margin-top:16px;text-align:right">
      <button id="settingsClose" class="btn primary" type="button">Готово</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
